name: Publish Pages

# One Pages site for the news media and the shorts queue. Started by Prepare media
# and by the box's YouTube media prep. The newest run wins, and the artifact always
# contains both trees: /m plus the news feeds, and /shorts plus feed/shorts_queue.json.
on:
  workflow_dispatch:
  # Editing this file on main publishes the combined site, so a deploy change
  # cannot land without the news files and the shorts queue going out together.
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - name: Check out x-news-collector (data only)
        uses: actions/checkout@v4
        with:
          repository: chatgpt820970/x-news-collector
          ssh-key: ${{ secrets.XNC_DEPLOY_KEY }}
          path: xnc
          sparse-checkout: data

      - name: Collect files from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/m
          printf '<!doctype html><title>chad-media</title>media files\n' > site/index.html
          python3 - <<'PY'
          import json, subprocess, collections
          d = json.load(open("xnc/data/media_ready.json"))
          base = "https://chatgpt820970.github.io/chad-media/m/"
          want = collections.defaultdict(set)
          for v in d.get("items", {}).values():
              urls = [v.get("video_1080_url")] + list(v.get("frame_urls") or []) + list(v.get("photo_urls") or [])
              for u in urls:
                  if u and u.startswith(base) and v.get("release_tag"):
                      want[v["release_tag"]].add(u[len(base):])
          n = 0
          for tag, names in want.items():
              cmd = ["gh", "release", "download", tag, "-R", "chatgpt820970/chad-media", "-D", "site/m", "--clobber"]
              for name in sorted(names):
                  cmd += ["-p", name]
              r = subprocess.run(cmd)
              n += len(names) if r.returncode == 0 else 0
          print(f"{n} files from {len(want)} releases")
          PY
          # Public read-only feed for the user's Grok (morning slots): same stories and media as BIBI uses.
          mkdir -p site/feed
          for f in candidates.json media_ready.json posted.json grok_queue.json grok_replies.json; do
            if [ -f "xnc/data/$f" ]; then cp "xnc/data/$f" site/feed/; fi
            if [ ! -s "site/feed/$f" ]; then
              curl -fsSL "https://raw.githubusercontent.com/chatgpt820970/x-news-collector/main/data/$f" -o "site/feed/$f" || true
            fi
          done
          # grok-feed-stamp: 2026-10-24T01:10:49.503299Z
          du -sh site

      - name: Attach the shorts queue and media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/feed site/shorts/v site/shorts/f
          gh api -H "Accept: application/vnd.github.raw" \
            "/repos/${GITHUB_REPOSITORY}/contents/shorts/feed/shorts_queue.json?ref=main" \
            > site/feed/shorts_queue.json
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path

          feed_path = Path("site/feed/shorts_queue.json")
          feed = json.loads(feed_path.read_text(encoding="utf-8"))
          items = feed.get("items") if isinstance(feed, dict) else None
          if not isinstance(items, list) or not items:
              raise SystemExit("shorts queue has no items")
          names: list[str] = []
          ready = 0
          for item in items:
              if not isinstance(item, dict) or not item.get("id"):
                  continue
              if item.get("status") == "ready":
                  ready += 1
              item_id = str(item["id"])
              names.append(f"{item_id}.mp4")
              names.extend(f"{item_id}-{index}.jpg" for index in (1, 2, 3))
          if not names:
              raise SystemExit("shorts queue has no media names")
          print(f"shorts queue items={len(names) // 4} ready={ready}")
          repo = os.environ["GITHUB_REPOSITORY"]
          download_dir = Path("site/shorts/_dl")
          download_dir.mkdir(parents=True, exist_ok=True)
          cmd = [
              "gh", "release", "download", "shorts-media",
              "-R", repo,
              "-D", str(download_dir),
              "--clobber",
          ]
          for name in names:
              cmd.extend(["-p", name])
          result = subprocess.run(cmd)
          if result.returncode != 0:
              raise SystemExit(f"shorts release download failed ({result.returncode})")
          video_dir = Path("site/shorts/v")
          frame_dir = Path("site/shorts/f")
          video_dir.mkdir(parents=True, exist_ok=True)
          frame_dir.mkdir(parents=True, exist_ok=True)
          for name in names:
              src = download_dir / name
              if not src.is_file() or src.stat().st_size < 100:
                  raise SystemExit(f"missing shorts file {name}")
              target = video_dir / name if name.endswith(".mp4") else frame_dir / name
              src.replace(target)
          shutil.rmtree(download_dir)
          print(f"attached {len(names)} shorts files")
          PY
          du -sh site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

      - uses: actions/deploy-pages@v4
