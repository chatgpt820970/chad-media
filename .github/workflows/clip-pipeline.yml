name: Clip pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only. Live posting also requires the CLIPPER_LIVE variable."
        type: boolean
        default: true
      now:
        description: "Optional ISO timestamp used as now for the dry-run."
        required: false
        default: ""
        type: string

permissions:
  contents: write

# A new push cancels the previous download so two 400MB fetches do not stack.
concurrency:
  group: clip-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and tesseract
        run: timeout 480 bash script/ci_apt.sh ffmpeg tesseract-ocr

      - name: Cookie files
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: python script/write_cookies.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Config check
        run: python -m clipper check

      - name: Dry-run
        env:
          CLIPPER_LIVE: "false"
        run: |
          python -m clipper run --dry-run --now "${{ inputs.now || '2026-10-27T00:00:00Z' }}" --output-dir work/dry-run --simulate-live
          python - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/dry-run/report.json").read_text())
          payloads = json.loads(Path("work/dry-run/buffer_payloads.json").read_text())
          if report["errors"]:
              raise SystemExit("dry-run reported errors: " + "; ".join(report["errors"]))
          if report["posting"] != "enabled":
              raise SystemExit("expected a plan while Sui BaseCamp is active")
          if not any(row.get("campaign_id") == "sui-basecamp" and row["status"] == "scheduled" for row in report["packages"]):
              raise SystemExit("Sui BaseCamp should be scheduled")
          if any(row.get("campaign_id") == "dhan-aziz" and row["status"] == "scheduled" for row in report["packages"]):
              raise SystemExit("Dhan Aziz drafts must not post before approval")
          if not any(row["status"] == "awaiting_approval" for row in report["packages"]):
              raise SystemExit("expected Dhan Aziz drafts")
          if not payloads or any("example.invalid" not in json.dumps(item) for item in payloads):
              raise SystemExit("dry-run payloads must stay on example.invalid")
          blob = "\n".join(report["warnings"])
          if "t-bird" not in blob or "10000" not in blob:
              raise SystemExit("expected a T Bird views warning")
          print("dry-run ok")
          PY

      - name: Validate a direct mp4 URL
        run: |
          python -m clipper validate-media-url --url "https://chatgpt820970.github.io/chad-media/live/live-tiktok-20261027T233000.000Z.mp4"
          if python -m clipper validate-media-url --url "https://github.com/chatgpt820970/chad-media/releases/download/clip-media/youtube.mp4"; then
            echo "release download URL must be rejected"
            exit 1
          fi
          echo "media url check ok"

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-dry-run
          path: work/dry-run/
          if-no-files-found: ignore

  fetch-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, gdown, and yt-dlp
        run: |
          timeout 480 bash script/ci_apt.sh ffmpeg tesseract-ocr
          timeout 180 python -m pip install --upgrade gdown curl_cffi gallery-dl
          timeout 180 python -m pip install -U --pre yt-dlp

      - name: Cookie files
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: python script/write_cookies.py

      - name: Download Sui, Dropbox, and content-plan media
        env:
          CLIPPER_LIVE: "false"
        run: python -m clipper fetch --output-dir work/fetch

      - name: Check the Sui short
        run: |
          python - << 'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path("work/fetch")
          manifest = json.loads((root / "manifest.json").read_text())
          if not manifest.get("ok"):
              raise SystemExit("fetch failed: " + "; ".join(manifest.get("errors") or []))
          caption = (root / "caption.txt").read_text()
          if "x.com/SuiNetwork" not in caption:
              raise SystemExit("caption missing x.com/SuiNetwork")
          clip = root / "sui-basecamp-short.mp4"
          if clip.stat().st_size < 1000:
              raise SystemExit("short clip is empty")
          probe = subprocess.check_output(
              ["ffprobe", "-v", "error", "-select_streams", "v:0", "-show_entries", "stream=width,height", "-of", "csv=p=0", str(clip)],
              text=True,
          ).strip()
          width, height = (int(part) for part in probe.split(","))
          if (width, height) != (720, 1280):
              raise SystemExit(f"expected 720x1280, got {width}x{height}")
          archive = Path(manifest["dropbox"]["path"])
          with archive.open("rb") as handle:
              if handle.read(2) != b"PK":
                  raise SystemExit("Dropbox download is not a zip")
          youtube = next(row for row in manifest["content_plan"] if row["platform"] == "youtube")
          if youtube.get("status") not in ("downloaded", "needs_cookies", "unavailable"):
              raise SystemExit("YouTube content-plan download missing: " + youtube.get("status"))
          for row in manifest["content_plan"]:
              print(row["platform"], row.get("status"), row.get("via") or "", row.get("bytes") or 0)
          print("sui short ok", clip.stat().st_size, "dropbox", archive.stat().st_size, "youtube", youtube.get("status"))
          PY

      - name: Upload Sui short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sui-basecamp-short
          path: |
            work/fetch/sui-basecamp-short.mp4
            work/fetch/caption.txt
            work/fetch/manifest.json
          if-no-files-found: error

      - name: Publish release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view clip-media >/dev/null 2>&1 || gh release create clip-media --prerelease --title "Clip media" --notes "Dry-run renders. Buffer is not called."
          gh release upload clip-media work/fetch/sui-basecamp-short.mp4 work/fetch/caption.txt --clobber

  public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, tesseract, yt-dlp, and gallery-dl
        run: |
          timeout 480 bash script/ci_apt.sh ffmpeg tesseract-ocr
          timeout 180 python -m pip install --upgrade curl_cffi gallery-dl
          timeout 180 python -m pip install -U --pre yt-dlp

      - name: Probe cookie-free sources
        run: python -m clipper fetch-public --output-dir work/public

      - name: Check the public-source report
        run: |
          python - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/public/report.json").read_text())
          rows = {row["name"]: row for row in report["sources"]}
          required = {"x_public", "tiktok_public", "reddit_json", "youtube_frontend"}
          if set(rows) != required:
              raise SystemExit(f"report names {sorted(rows)} != {sorted(required)}")
          for name, row in rows.items():
              if row["status"] not in ("downloaded", "unavailable"):
                  raise SystemExit(f"{name} status {row['status']}")
              if row["status"] == "downloaded" and int(row.get("bytes") or 0) < 8000:
                  raise SystemExit(f"{name} downloaded without a real video")
              print(name, row["status"], row.get("bytes"), row.get("method") or "", (row.get("error") or "")[:180])
          print("public sources report ok")
          PY

      - name: Upload public-source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-sources
          path: work/public/
          if-no-files-found: error

  cookie-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, tesseract, and yt-dlp
        run: |
          timeout 480 bash script/ci_apt.sh ffmpeg tesseract-ocr
          timeout 300 python -m pip install --upgrade curl_cffi
          timeout 300 python -m pip install -U --pre yt-dlp

      - name: Cookie files
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: python script/write_cookies.py

      - name: Probe YouTube, TikTok, and Instagram cookie downloads
        env:
          CLIPPER_LIVE: "false"
        run: python -m clipper fetch-cookies --output-dir work/cookies

      - name: Check the cookie report
        run: |
          python - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/cookies/report.json").read_text())
          alerts = json.loads(Path("work/cookies/alerts.json").read_text())
          rows = {row["name"]: row for row in report["sources"]}
          required = {"youtube", "tiktok", "instagram"}
          allowed = {"missing", "cookies_expired", "downloaded", "unavailable"}
          if set(rows) != required:
              raise SystemExit(f"report names {sorted(rows)} != {sorted(required)}")
          if alerts.get("paused"):
              raise SystemExit("cookie probe paused a platform: " + ",".join(sorted(alerts["paused"])))
          for name, row in rows.items():
              status = row.get("status")
              if status not in allowed:
                  raise SystemExit(f"{name} status {status}")
              if status == "downloaded" and int(row.get("bytes") or 0) < 8000:
                  raise SystemExit(f"{name} downloaded without a real video")
              print(name, status, "bytes", row.get("bytes") or 0, "reason", row.get("reason") or "-")
          print("cookie downloads report ok")
          PY

      - name: Upload cookie report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cookie-downloads
          path: work/cookies/
          if-no-files-found: error
