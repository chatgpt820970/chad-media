name: Clip monitor

# On unless the repository variable CLIPPER_MONITOR is the lowercase string false.
# The job checks submissions/pending.json and fails when a live post is past
# its 30-minute Content Rewards deadline so GitHub can email the assistant.
# The job stays capped at 3 minutes.
on:
  schedule:
    # Off :00/:15/:30/:45. GitHub drops congested quarter-hour schedules.
    # Still every 15 minutes. The job stays capped at 3 minutes.
    - cron: "7,22,37,52 * * * *"
      timezone: UTC
  workflow_dispatch:
    inputs:
      key:
        description: "Optional pending id or post URL to mark submitted."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  monitor:
    if: ${{ vars.CLIPPER_MONITOR != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: clip-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mark submitted
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.key != '' }}
        run: python -m clipper mark-submitted --key "${{ inputs.key }}"

      - name: Deadlines
        env:
          CLIPPER_MONITOR: ${{ vars.CLIPPER_MONITOR }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: python -m clipper monitor

      - name: Commit queue updates
        if: ${{ always() && vars.CLIPPER_MONITOR != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions state || true
          if git diff --cached --quiet; then
            echo "no queue changes"
          else
            git commit -m "chore(submissions): update Content Rewards queue"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
