name: Whop Clipper

# Platform mapping for Whop Content Rewards, plus the daily 30-clip feed.
# 00:15 UTC is 05:45 IST. 01:15 UTC is the 06:45 IST backup.
# X (@chadriyo) is Dishpilot. YouTube Shorts (Denzen) is Dishpilot and Mr. Pa.
# Instagram Reels (@benreelr) is Rascals, Dishpilot, and Mr. Pa.
# Pool Guard rejects high-denial bounties (whop-ai-shane-gillis at 99.8%).
on:
  schedule:
    - cron: "15 0 * * *"
    - cron: "15 1 * * *"
  push:
    branches: [main]
    paths:
      - "whop/**"
      - ".github/workflows/whop-clipper.yml"
  pull_request:
    paths:
      - "whop/**"
      - ".github/workflows/whop-clipper.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whop-clipper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test platform campaign mapping and Pool Guard
        run: python -m unittest whop.test_clipper -v

      - name: Verify the 10-slot manifest pays X and YouTube Shorts separately
        run: python whop/clipper.py verify-manifest

      - name: Build the daily 30-clip feed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python whop/whop_clipper.py build-daily-30
