name: Growth YouTube

# Schedule stays off until a Growth demos run approves sample clips.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only."
        type: boolean
        default: false
      next_slot:
        description: "Schedule the next peak slot at least 20 minutes ahead."
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: growth-youtube
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg, tesseract, and yt-dlp
        run: |
          timeout 480 bash script/ci_apt.sh ffmpeg tesseract-ocr fonts-dejavu-core
          timeout 240 python -m pip install -U --pre "yt-dlp[default]" curl_cffi opencv-python-headless

      - name: Cookie files
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: python script/write_cookies.py

      - name: Check config
        run: python -m growth.youtube check

      - name: Schedule posts
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_YOUTUBE: ${{ vars.BUFFER_CHANNEL_YOUTUBE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.next_slot }}" = "true" ]; then
            args="--next-slot"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry_run }}" != "true" ]; then
            python -m growth.youtube run $args
          else
            python -m growth.youtube run --dry-run $args
          fi

      - name: Open a ci-failed issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m growth.youtube alert

      - name: Commit dedupe log
        if: ${{ always() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth/youtube/state/seen.json growth/youtube/state/log.jsonl || true
          if git diff --cached --quiet; then
            echo "no growth-youtube state changes"
          else
            git commit -m "chore(growth-youtube): record scheduled posts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
