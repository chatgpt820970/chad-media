name: Prepare media

# Started by x-news-collector's collect run (it pushes trigger/last.json here) or by hand.
# Runs media_prep.py from the private x-news-collector repo (non-YouTube videos + photos; the
# box does the YouTube ones), publishes the files as a GitHub Release here, merges the result into
# x-news-collector data/media_ready.json and starts "Publish Pages".
on:
  push:
    branches: [main]
    paths: ["trigger/**"]
  workflow_dispatch:

permissions:
  contents: write   # create/delete releases in this repo
  actions: write    # start the Publish Pages workflow

concurrency:
  group: prepare-media
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check out x-news-collector
        uses: actions/checkout@v4
        with:
          repository: chatgpt820970/x-news-collector
          ssh-key: ${{ secrets.XNC_DEPLOY_KEY }}
          path: xnc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2   # JS runtime yt-dlp needs for YouTube
        with:
          deno-version: v2.x

      - name: Install yt-dlp, ffmpeg
        run: |
          pip install -q -U "yt-dlp[default]" requests pillow
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
          echo "$(ls -d /tmp/ffmpeg-master-latest-linux64-gpl)/bin" >> "$GITHUB_PATH"

      - name: Prepare media
        working-directory: xnc
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_REPO: ${{ github.repository }}
          MEDIA_PART: ${{ runner.temp }}/part.json
          SKIP_YOUTUBE: "1"   # YouTube blocks GitHub's servers; the box handles those
          YT_COOKIES: ${{ secrets.YT_COOKIES }}   # optional; unset = no cookies
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt_cookies.txt"; export YT_COOKIES_FILE="$RUNNER_TEMP/yt_cookies.txt" SKIP_YOUTUBE=0; fi
          unset YT_COOKIES
          python -u media_prep.py

      - name: Merge into media_ready.json and push
        working-directory: xnc
        run: |
          git config user.name "x-news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python media_prep.py merge "$RUNNER_TEMP/part.json" || exit 0
            git add data/media_ready.json
            if git diff --cached --quiet; then echo "No change."; exit 0; fi
            git commit -q -m "Update media_ready.json $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git push -q origin HEAD:main && exit 0
            echo "Push failed, retrying ($i)..."; sleep 5
          done
          exit 1

      - name: Start Publish Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-pages.yml -R "$GITHUB_REPOSITORY"
